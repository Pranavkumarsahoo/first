<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            cursor: pointer;
        }
        .first{
          color: rgb(0, 113, 135);
    
        }
        first:hover{
            color: rgb(199,81,31);
        }
        .nike{
            font-size:16px;
        }
        
        .second{
            color: rgb(0,118,0);
            font-size:12px;
            font-weight: bolder;
        }
        .free{
            font-size: 11px;
            color: black;
        }
        .cart{
            font-size: 11px;
            background-color: rgb(255,216,20);
            border:none;
            border-radius:25px;
            width: 85px;
            height: 22px;
            margin-right: 8px;
        }
        .cart:hover{
           background-color: rgb(247, 202, 0); 
        }
        .buy{
            width:85px;
            background-color: rgb(255,164,28);
            border:none;
            border-radius: 25px;
            height: 22px;
            font-size:11px;       }
            .buy:hover{
                background-color: red;
            }
             .add-to-cart-button:active {
        opacity: 0.5;
        }
    </style>
</head> 
<body>
    <a class="first" href="https://amazon.com" target="_blank">
     Back to Amazon
   </a>
   <a href="https://youtube.com" target="_blank">
    youtube
   </a>
   <br>
   <b class="nike">
        Nike Black Running Shoes
    </b>
    <p class="second">
        $39 - in stock.
    </p>
    <p class="free">
      Free delivery tomorrow.
    </p>
    <button class="cart">
        Add to Cart
    </button>
    <button class="buy">
        Buy now
    </button>
</body>
</html>
